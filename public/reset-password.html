<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set a new password | FLEXY</title>
    <!-- The page is reached through one-time links; keep it out of search results
         and never leak the link through the Referer header. -->
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="css/style.css?v=4">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="auth-page">
    <main class="auth-container">
        <div class="auth-card glass-card">
            <div class="auth-brand">
                <a href="index.html" aria-label="Flexy home">
                    <span class="logo-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5 4 4"/><path d="m11 9 4 4"/><path d="m13 7-8 8"/><path d="M9 11l-4 4"/><path d="m13 13-7 7"/><path d="M20 20H10"/></svg>
                    </span>
                    <span class="auth-brand-name">FLEXY</span>
                    <span class="auth-brand-tagline">Every Item Finds Its Value</span>
                </a>
            </div>

            <h1 class="auth-title">Set a new password</h1>
            <p class="auth-subtitle">This link works once. Setting a password signs your account out on every device.</p>

            <div id="form-alert" class="auth-alert" role="alert"></div>

            <form id="reset-form" novalidate>
                <div class="auth-field">
                    <label class="auth-label" for="password">New password</label>
                    <div class="auth-input-wrap">
                        <input class="auth-input auth-input--with-toggle" id="password" name="password" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="password-rules password-error">
                        <button type="button" class="auth-toggle" data-toggle-password="password" aria-controls="password" aria-label="Show password">Show</button>
                    </div>
                    <ul class="auth-checklist" id="password-rules">
                        <li data-rule="length">At least 8 characters</li>
                        <li data-rule="mix">A letter and a number</li>
                    </ul>
                    <p class="auth-error" id="password-error"></p>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="confirmPassword">Confirm new password</label>
                    <div class="auth-input-wrap">
                        <input class="auth-input auth-input--with-toggle" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="confirmPassword-error">
                        <button type="button" class="auth-toggle" data-toggle-password="confirmPassword" aria-controls="confirmPassword" aria-label="Show password">Show</button>
                    </div>
                    <p class="auth-error" id="confirmPassword-error"></p>
                </div>

                <button type="submit" class="btn btn-primary auth-submit">Save password</button>
            </form>

            <div id="reset-done" class="auth-alert is-visible is-success" role="status" hidden>
                Your password is set for <strong id="reset-username">your account</strong>.
                <a class="auth-link" href="login.html">Log in now</a>
            </div>

            <p class="auth-switch"><a class="auth-link" href="login.html">Back to log in</a></p>
        </div>
    </main>

    <script src="js/auth.js?v=4"></script>
</body>
</html>
