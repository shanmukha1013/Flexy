<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | FLEXY</title>
    <meta name="description" content="Log in to Flexy, the marketplace for collectors.">
    <link rel="stylesheet" href="css/style.css?v=4">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="auth-page">
    <main class="auth-container">
        <div class="auth-card glass-card">
            <div class="auth-brand">
                <a href="index.html" aria-label="Flexy home">
                    <span class="logo-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5 4 4"/><path d="m11 9 4 4"/><path d="m13 7-8 8"/><path d="M9 11l-4 4"/><path d="m13 13-7 7"/><path d="M20 20H10"/></svg>
                    </span>
                    <span class="auth-brand-name">FLEXY</span>
                    <span class="auth-brand-tagline">Every Item Finds Its Value</span>
                </a>
            </div>

            <h1 class="auth-title">Log in</h1>
            <p class="auth-subtitle">Welcome back. Use your username or email.</p>

            <div id="form-alert" class="auth-alert" role="alert"></div>

            <form id="login-form" novalidate>
                <div class="auth-field">
                    <label class="auth-label" for="identifier">Username or email</label>
                    <input class="auth-input" id="identifier" name="identifier" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="254" required aria-describedby="identifier-error">
                    <p class="auth-error" id="identifier-error"></p>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="password">Password</label>
                    <div class="auth-input-wrap">
                        <input class="auth-input auth-input--with-toggle" id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required aria-describedby="password-error">
                        <button type="button" class="auth-toggle" data-toggle-password="password" aria-controls="password" aria-label="Show password">Show</button>
                    </div>
                    <p class="auth-error" id="password-error"></p>
                </div>

                <button type="submit" class="btn btn-primary auth-submit">Log in</button>
            </form>

            <p class="auth-switch">New to Flexy? <a class="auth-link" href="signup.html">Create an account</a></p>
        </div>
    </main>

    <script src="js/auth.js?v=4"></script>
</body>
</html>
