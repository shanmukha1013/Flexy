
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEXY - Create Account</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4b6021;
            --primary-hover: #3d501a;
            --text-primary: #202b3a;
            --text-secondary: #58677b;
            --border: #c9e9e4;
            --background: #fcfaf7;
            --input-background: #e7e6e1;
            --danger: #dc2626;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .auth-card {
            width: 100%;
            max-width: 530px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 42px 45px;
            box-shadow: 0 14px 28px rgba(30,42,35,0.08);
            animation: reveal 0.5s ease;
        }

        @keyframes reveal {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo-container {
            text-align: center;
            cursor: pointer;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            margin: 0 auto 12px;
            color: var(--primary);
        }

        .logo-text {
            font-size: 35px;
            font-weight: 750;
            letter-spacing: -1px;
        }

        .logo-subtext {
            color: var(--text-secondary);
            font-size: 16px;
            margin-top: 5px;
        }

        .form-heading {
            margin-top: 30px;
            text-align: center;
        }

        .form-heading h2 {
            font-size: 23px;
            margin-bottom: 7px;
        }

        .form-heading p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .auth-form {
            margin-top: 28px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        .form-group label {
            display: block;
            color: #344054;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 9px;
        }

        .form-group input {
            width: 100%;
            height: 52px;
            padding: 0 17px;
            border: 1px solid #d5d3cd;
            border-radius: 12px;
            background: var(--input-background);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            background: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(75,96,33,0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 75px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
        }

        .auth-inline-error {
            color: var(--danger);
            font-size: 12px;
            margin-top: 5px;
            min-height: 14px;
        }

        .btn {
            width: 100%;
            min-height: 51px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: 0.25s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 12px 24px rgba(45,61,24,0.13);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .btn-block {
            margin-top: 20px;
        }

        .auth-message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
        }

        .auth-message.error {
            display: block;
            color: #a12820;
            background: #fff0ef;
        }

        .auth-message.success {
            display: block;
            color: #286332;
            background: #edf7ed;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
        }

        .auth-footer p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .auth-container {
                padding: 18px;
            }

            .auth-card {
                padding: 35px 24px;
            }

            .logo-text {
                font-size: 31px;
            }
        }
    </style>
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <!-- FLEXY LOGO -->
        <div class="logo-container"
             onclick="window.location.href='home.html'">

            <div class="logo-icon">
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2.2"
                     stroke-linecap="round"
                     stroke-linejoin="round"
                     width="100%"
                     height="100%">
                    <path d="m15 5 4 4"/>
                    <path d="m11 9 4 4"/>
                    <path d="m13 7-8 8"/>
                    <path d="M9 11l-4 4"/>
                    <path d="m13 13-7 7"/>
                    <path d="M20 20H10"/>
                </svg>
            </div>

            <h1 class="logo-text">FLEXY</h1>

            <p class="logo-subtext">
                Every Item Finds Its Value
            </p>
        </div>

        <!-- HEADING -->
        <div class="form-heading">
            <h2>Create Your Account</h2>
            <p>Join FLEXY and start exploring the marketplace.</p>
        </div>

        <!-- API MESSAGE -->
        <div id="auth-message"
             class="auth-message"
             role="alert"
             aria-live="polite">
        </div>

        <!-- REGISTER FORM -->
        <form id="register-form" class="auth-form">

            <!-- NAME -->
            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required>

                <p id="name-error"
                   class="auth-inline-error"></p>
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required>

                <p id="email-error"
                   class="auth-inline-error"></p>
            </div>

            <!-- PASSWORD -->
            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required>

                    <button type="button"
                            class="toggle-password"
                            data-target="password">
                        Show
                    </button>
                </div>

                <p id="password-error"
                   class="auth-inline-error"></p>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="form-group">
                <label for="confirm-password">
                    Confirm Password
                </label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required>

                    <button type="button"
                            class="toggle-password"
                            data-target="confirm-password">
                        Show
                    </button>
                </div>

                <p id="confirm-error"
                   class="auth-inline-error"></p>
            </div>

            <!-- REGISTER BUTTON -->
            <button type="submit"
                    class="btn btn-primary btn-block"
                    id="register-button">

                <span id="submit-btn-text">
                    Create Account
                </span>

            </button>

        </form>

        <!-- LOGIN LINK -->
        <div class="auth-footer">
            <p>
                Already have an account?
                <a href="login.html">Sign In</a>
            </p>
        </div>

        <!-- SUPPORT -->
        <div class="auth-footer">
            <p>
                Need help?
                <a href="mailto:support@example.com">
                    Contact Support
                </a>
            </p>
        </div>

    </div>

</div>

<script>

// API BACKEND CONFIGURATION
const PRODUCTION_BACKEND_URL = 'https://flexy-backend-pgw7.onrender.com';
const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
const API_BASE = (isLocal ? 'http://' + window.location.hostname + ':3001' : PRODUCTION_BACKEND_URL) + '/api';

// Redirect if already authenticated
(function checkExistingSession() {
    const existingToken = localStorage.getItem('flexy_token') || sessionStorage.getItem('accessToken');
    if (existingToken && window.location.search.indexOf('force=1') === -1) {
        // User is already logged in
    }
})();

// SHOW / HIDE PASSWORD
document.querySelectorAll(".toggle-password")
    .forEach(button => {

        button.addEventListener("click", function () {

            const input = document.getElementById(
                this.dataset.target
            );

            if (input.type === "password") {
                input.type = "text";
                this.textContent = "Hide";
            } else {
                input.type = "password";
                this.textContent = "Show";
            }
        });

    });


// DISPLAY MESSAGE
function showMessage(message, type) {

    const box = document.getElementById("auth-message");

    box.textContent = message;
    box.className = "auth-message " + type;
}


// EMAIL VALIDATION
function validateEmail(email) {

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}


// REGISTER FORM
document.getElementById("register-form")
    .addEventListener("submit", async function (event) {

        event.preventDefault();

        const name = document.getElementById("name")
            .value.trim();

        const email = document.getElementById("email")
            .value.trim().toLowerCase();

        const password = document.getElementById("password")
            .value;

        const confirmPassword =
            document.getElementById("confirm-password").value;

        const nameError = document.getElementById("name-error");
        const emailError = document.getElementById("email-error");
        const passwordError = document.getElementById("password-error");
        const confirmError = document.getElementById("confirm-error");

        const button = document.getElementById("register-button");
        const buttonText = document.getElementById("submit-btn-text");

        // CLEAR OLD ERRORS
        [nameError, emailError, passwordError, confirmError]
            .forEach(element => element.textContent = "");

        document.getElementById("auth-message").className =
            "auth-message";

        // NAME VALIDATION
        if (name.length < 2) {
            nameError.textContent =
                "Please enter your full name (at least 2 characters).";
            return;
        }

        // EMAIL VALIDATION
        if (!validateEmail(email)) {
            emailError.textContent =
                "Please enter a valid email address.";
            return;
        }

        // PASSWORD VALIDATION
        if (password.length < 8) {
            passwordError.textContent =
                "Password must contain at least 8 characters.";
            return;
        }
        if (!/[A-Za-z]/.test(password) || !/[0-9]/.test(password)) {
            passwordError.textContent =
                "Password must contain at least one letter and one number.";
            return;
        }

        // CONFIRM PASSWORD
        if (password !== confirmPassword) {
            confirmError.textContent =
                "Passwords do not match.";
            return;
        }

        button.disabled = true;
        buttonText.textContent = "Creating Account...";

        try {

            // SEND REQUEST TO EXPRESS BACKEND
            const response = await fetch(
                `${API_BASE}/auth/register`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        name,
                        email,
                        password,
                        confirmPassword
                    })
                }
            );

            // Safe parsing: Never blindly call response.json()
            let data = null;
            const responseText = await response.text();
            if (responseText && responseText.trim().length > 0) {
                try {
                    data = JSON.parse(responseText);
                } catch (parseError) {
                    console.warn("Server response was not JSON:", responseText);
                }
            }

            if (!response.ok) {
                let errorMsg = "";
                if (data && (data.error || data.message)) {
                    errorMsg = data.error || data.message;
                } else {
                    switch (response.status) {
                        case 400:
                            errorMsg = "Invalid registration details. Please check the form.";
                            break;
                        case 401:
                            errorMsg = "Unauthorized request. Please try again.";
                            break;
                        case 404:
                            errorMsg = "Registration service endpoint not found (404).";
                            break;
                        case 405:
                            errorMsg = "Method Not Allowed (405). Please check backend route configuration.";
                            break;
                        case 409:
                            errorMsg = "An account with this email already exists. Log in instead.";
                            break;
                        case 422:
                            errorMsg = "Validation failed. Please verify your details.";
                            break;
                        case 429:
                            errorMsg = "Too many registration attempts. Please wait and try again.";
                            break;
                        case 500:
                            errorMsg = "Server error occurred. Please try again shortly.";
                            break;
                        default:
                            errorMsg = "Registration failed (HTTP " + response.status + "). Please try again.";
                    }
                }

                // Map field-specific errors if returned
                if (data && data.fields) {
                    if (data.fields.name || data.fields.fullName) nameError.textContent = data.fields.name || data.fields.fullName;
                    if (data.fields.email) emailError.textContent = data.fields.email;
                    if (data.fields.password) passwordError.textContent = data.fields.password;
                    if (data.fields.confirmPassword) confirmError.textContent = data.fields.confirmPassword;
                }

                throw new Error(errorMsg);
            }

            // Store authentication session if returned
            const token = (data && (data.token || data.accessToken)) || null;
            if (token) {
                localStorage.setItem("flexy_token", token);
                sessionStorage.setItem("accessToken", token);
                if (data.user) {
                    localStorage.setItem("flexy_user", JSON.stringify(data.user));
                    sessionStorage.setItem("user", JSON.stringify(data.user));
                }
            }

            showMessage(
                "Account created successfully! Redirecting to login...",
                "success"
            );

            // REDIRECT TO LOGIN
            setTimeout(() => {
                window.location.href = "login.html";
            }, 1200);

        } catch (error) {

            console.error("Registration error:", error);

            showMessage(
                error.message || "Unable to connect to server.",
                "error"
            );

            button.disabled = false;
            buttonText.textContent = "Create Account";
        }

    });

</script>

</body>
</html>
