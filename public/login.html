<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEXY - Authentication</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/loader.js"></script>
    <style>
        /* ---------- Page shell: dark, flat, left-aligned (matches reference) ---------- */
        body { background: #202020; }
        .auth-container { background: #202020; }
        .auth-card.card.glass-card {
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            max-width: 440px;
            width: 100%;
            padding: 2.5rem 1.5rem 2rem;
            animation: card-reveal 0.4s var(--ease-spring);
        }
        @keyframes card-reveal {
            from { transform: translateY(12px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Header: back arrow + title */
        .auth-header {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            margin-bottom: 2rem;
        }
        .auth-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            color: #fff;
            border-radius: 50%;
            text-decoration: none;
        }
        .auth-back:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .auth-back svg { width: 1.4rem; height: 1.4rem; }
        .auth-title {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0;
        }

        /* Floating-label field */
        .field {
            position: relative;
            display: block;
        }
        .field input {
            width: 100%;
            height: 4.6rem;
            padding: 1.7rem 1.25rem 0.6rem;
            background: transparent;
            border: 1px solid #5b5d60;
            border-radius: 1.25rem;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color var(--transition-fast);
        }
        .field input:hover { border-color: #8a8d91; }
        .field input:focus { border-color: #e6e6e6; }
        .field label {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: #a8abaf;
            font-size: 1.05rem;
            pointer-events: none;
            transition: top 0.15s ease, font-size 0.15s ease, transform 0.15s ease;
        }
        .field input:focus + label,
        .field input:not(:placeholder-shown) + label {
            top: 0.95rem;
            transform: none;
            font-size: 0.82rem;
        }
        .field input.is-invalid { border-color: var(--danger); }
        .field input[type="password"] { padding-right: 3.2rem; }
        .pw-toggle {
            position: absolute;
            right: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            width: 2rem;
            height: 2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: #a8abaf;
            cursor: pointer;
            border-radius: 50%;
        }
        .pw-toggle:hover { color: #fff; }
        .pw-toggle:focus-visible { outline: 2px solid var(--primary); }
        .pw-toggle svg { width: 1.2rem; height: 1.2rem; }

        .auth-inline-error {
            min-height: 1.1rem;
            margin: 0.5rem 0 0 1rem;
            color: var(--danger);
            font-size: 0.82rem;
        }

        /* Pill buttons */
        .pill-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 3.4rem;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: filter var(--transition-fast), background var(--transition-fast);
        }
        .pill-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        .pill-primary {
            background: var(--primary);
            color: #fff;
            margin-top: 0.75rem;
        }
        .pill-primary:hover { filter: brightness(1.08); }
        .pill-primary:disabled { opacity: 0.55; cursor: not-allowed; filter: none; }

        .auth-help {
            text-align: center;
            margin: 1.5rem 0 0;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .auth-help a { color: #fff; text-decoration: none; }
        .auth-help a:hover { text-decoration: underline; }

        .auth-brand {
            text-align: center;
            margin-top: 3.5rem;
            color: #fff;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.04em;
            cursor: pointer;
        }
        .auth-brand small {
            display: block;
            margin-top: 0.25rem;
            font-weight: 400;
            font-size: 0.78rem;
            letter-spacing: 0;
            color: #a8abaf;
        }

        /* Shared helpers (OTP modal etc.) */
        .forgot-link { color: var(--primary); text-decoration: none; transition: color var(--transition-fast); }
        .forgot-link:hover { color: var(--primary-hover); }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        .otp-status { min-height: 1.25rem; margin: 0; font-size: 0.85rem; line-height: 1.4; }
        .otp-status.is-error { color: var(--danger); }
        .otp-status.is-success { color: var(--success); }
        .otp-status.is-info { color: var(--text-secondary); }
        .otp-input:disabled { opacity: 0.6; }
        #resend-otp[aria-disabled="true"] { pointer-events: none; opacity: 0.45; }
        .otp-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(249,115,22,0.1);
            border: 1px solid rgba(249,115,22,0.3);
            border-radius: 20px;
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 1.25rem;
        }

        @media (prefers-reduced-motion: reduce) {
            .auth-card.card.glass-card { animation: none; }
            .field label { transition: none; }
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card card glass-card">
            <div class="auth-header">
                <a href="home.html" class="auth-back" aria-label="Back to home">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
                </a>
                <h1 class="auth-title">Log in to FLEXY</h1>
            </div>

            <form id="login-form" class="auth-form" novalidate>
                <div class="form-group">
                    <div class="field">
                        <input type="email" id="email" name="email" placeholder=" " autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required aria-describedby="email-error">
                        <label for="email">Email address</label>
                    </div>
                    <p id="email-error" class="auth-inline-error" role="alert" aria-live="polite"></p>
                </div>

                <div class="form-group" style="margin-top: 0.25rem;">
                    <div class="field">
                        <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" required aria-describedby="password-error">
                        <label for="password">Password</label>
                        <button type="button" id="toggle-password" class="pw-toggle" aria-label="Show password" aria-pressed="false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <p id="password-error" class="auth-inline-error" role="alert" aria-live="polite"></p>
                </div>

                <button type="submit" class="pill-btn pill-primary">
                    <span class="btn-text" id="submit-btn-text">Log in</span>
                </button>
            </form>

            <p class="auth-help"><a href="#" id="forgot-password" class="forgot-link-plain">Forgotten password?</a></p>

            <div class="auth-brand" onclick="window.location.href='home.html'">
                FLEXY
                <small>Every Item Finds Its Value</small>
            </div>
        </div>
    </div>

    <!-- OTP Verification Modal -->
    <div id="otp-modal" class="modal">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h3>Verify Security Code</h3>
                <button type="button" class="close-modal" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body" style="text-align: center;">
                <div class="otp-status-badge">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    Verification code sent
                </div>
                <p id="otp-message" style="color: var(--text-secondary); font-size: 0.92rem; margin-bottom: 1.5rem; line-height: 1.6;">Enter the 6-digit code sent to your email.</p>
                <div class="otp-container" role="group" aria-label="6-digit verification code">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1 of 6">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 2 of 6">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 3 of 6">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 4 of 6">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 5 of 6">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" aria-label="Digit 6 of 6">
                </div>
                <p id="otp-status" class="otp-status" role="alert" aria-live="polite"></p>
                <div class="otp-actions" style="margin-top: 1.25rem;">
                    <button id="verify-otp" type="button" class="btn btn-primary btn-block" style="font-weight: 600;">Verify &amp; Continue</button>
                    <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 1rem;">
                        Didn't receive code? <a href="#" id="resend-otp" class="forgot-link" role="button">Resend code<span id="otp-countdown" style="color: var(--text-muted);"></span></a>
                    </p>
                    <p id="otp-expiry" style="color: var(--text-muted); font-size: 0.78rem; margin-top: 0.5rem;">Code expires in 5 minutes</p>
                    <p style="font-size: 0.85rem; margin-top: 0.75rem;"><a href="#" id="change-email" class="forgot-link">Use a different email</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var pw = document.getElementById('password');
            var btn = document.getElementById('toggle-password');
            if (!pw || !btn) return;
            btn.addEventListener('click', function () {
                var show = pw.type === 'password';
                pw.type = show ? 'text' : 'password';
                btn.setAttribute('aria-pressed', String(show));
                btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            });
        })();
    </script>
    <script src="js/notify.js?v=3"></script>
    <script src="js/auth.js?v=3"></script>
</body>
</html>
